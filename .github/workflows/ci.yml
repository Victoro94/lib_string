name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Criterion
        run: sudo apt update && sudo apt install -y libcriterion-dev

      - name: Install Clang-Format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Format checking
        run: ./clang-format.sh check

      - name: Build
        run: make

      - name: Tests
        run: make check

      - name: Cleaning
        run: make clean

  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'src/**'
              - 'Doxyfile'
              - 'DoxygenLayout.xml'
              - 'Docs.md'
              - 'README.md'
              - 'Makefile'
              - 'docs-theme/**'

  deploy:
    needs: [ ci, changes ]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt update && sudo apt install -y doxygen

      - name: Generate docs
        run: make docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false